name: Daily Rental Scrape

on:
  schedule:
    # Runs at 03:00 UTC every day = 08:30 AM Sri Lanka time (UTC+5:30)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit matches.csv back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        run: python main.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.csv seen_urls.json
          git diff --quiet --cached || git commit -m "Daily scrape: $(date -u +'%Y-%m-%d')"
          git push
